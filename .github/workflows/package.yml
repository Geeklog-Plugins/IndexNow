name: Build installable archive

on:
  push:
    branches:
      - generic-item-listener
      - main
      - develop-1.2.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -e
          find . -type f \( -name '*.php' -o -name '*.inc' \) \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Verify release metadata and interoperability
        shell: bash
        run: |
          set -e
          grep -q "'pi_version'.*'1.2.1'" autoinstall.php
          grep -q "'pi_gl_version'.*'2.1.1'" autoinstall.php
          grep -q 'function plugin_itemsaved_indexnow' functions.inc
          grep -q 'function plugin_itemdeleted_indexnow' functions.inc
          grep -q 'function indexnow_resolve_saved_plugin_url' functions.inc
          grep -q 'function indexnow_resolve_deleted_plugin_url' functions.inc
          grep -q 'function indexnow_validate_url' functions.inc
          grep -q 'function indexnow_validate_key' functions.inc
          grep -q 'function indexnow_sanitize_log_value' functions.inc
          grep -q 'function indexnow_apply_curl_security' functions.inc
          grep -q 'batchSize = 100' functions.inc
          grep -q 'function indexnow_record_submission' submission_history.php
          grep -q 'indexnow_submissions' sql/mysql_install.php

      - name: Build installable archive
        shell: bash
        run: |
          set -e
          rm -rf build
          mkdir -p build/indexnow

          cp -a \
            admin \
            language \
            sql \
            autoinstall.php \
            configuration_validation.php \
            functions.inc \
            submission_history.php \
            install_defaults.php \
            install_updates.php \
            CHANGELOG.md \
            INSTALL \
            README.md \
            build/indexnow/

          cd build
          zip -r indexnow_1.2.1_2.1.1.zip indexnow >/dev/null
          unzip -t indexnow_1.2.1_2.1.1.zip >/dev/null
          test "$(zipinfo -1 indexnow_1.2.1_2.1.1.zip | head -n 1)" = 'indexnow/'
          sha256sum indexnow_1.2.1_2.1.1.zip > indexnow_1.2.1_2.1.1.zip.sha256

      - name: Commit archive to dist
        shell: bash
        run: |
          set -e
          mkdir -p dist
          rm -f dist/indexnow_*.zip dist/indexnow_*.zip.sha256
          cp build/indexnow_1.2.1_2.1.1.zip dist/indexnow_1.2.1_2.1.1.zip
          cp build/indexnow_1.2.1_2.1.1.zip.sha256 dist/indexnow_1.2.1_2.1.1.zip.sha256

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -f dist

          if git diff --cached --quiet; then
            echo 'Archive is already up to date.'
            exit 0
          fi

          git commit -m 'Build IndexNow 1.2.1 installable archive [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
